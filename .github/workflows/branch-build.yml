name: Branch Build

on:
  push:
    branches: [fix/scanned-pdf-rendering]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke-test scanned CCITT PDF rendering
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { init } from '@embedpdf/pdfium';

          const fixture = '';
          const pdfBytes = Buffer.from(fixture, 'base64');
          const rawWasm = readFileSync('node_modules/@embedpdf/pdfium/dist/pdfium.wasm');
          const wasmBinary = rawWasm.buffer.slice(rawWasm.byteOffset, rawWasm.byteOffset + rawWasm.byteLength);
          const pdfium = await init({ wasmBinary, thisProgram: 'pdf-recolor-test' });
          pdfium.PDFiumExt_Init();

          const filePtr = pdfium.pdfium.wasmExports.malloc(pdfBytes.length);
          pdfium.pdfium.HEAPU8.set(pdfBytes, filePtr);
          const doc = pdfium.FPDF_LoadMemDocument(filePtr, pdfBytes.length, '');
          if (!doc) throw new Error(`Fixture failed to open: ${pdfium.FPDF_GetLastError()}`);

          const page = pdfium.FPDF_LoadPage(doc, 0);
          if (!page) throw new Error('Fixture page failed to open');
          const width = Math.ceil(pdfium.FPDF_GetPageWidthF(page));
          const height = Math.ceil(pdfium.FPDF_GetPageHeightF(page));
          const bitmap = pdfium.FPDFBitmap_Create(width, height, 0);
          if (!bitmap) throw new Error('Fixture bitmap allocation failed');

          try {
            pdfium.FPDFBitmap_FillRect(bitmap, 0, 0, width, height, 0xffffffff);
            pdfium.FPDF_RenderPageBitmap(bitmap, page, 0, 0, width, height, 0, 0x10);
            const bufferPtr = pdfium.FPDFBitmap_GetBuffer(bitmap);
            const rgba = new Uint8Array(pdfium.pdfium.HEAPU8.buffer, bufferPtr, width * height * 4);
            let darkPixels = 0;
            for (let i = 0; i < rgba.length; i += 4) {
              if (rgba[i] < 128 && rgba[i + 1] < 128 && rgba[i + 2] < 128) darkPixels += 1;
            }
            if (darkPixels < 100) throw new Error(`CCITT image rendered blank (${darkPixels} dark pixels)`);
            console.log(`CCITT render OK: ${darkPixels} dark pixels`);
          } finally {
            pdfium.FPDFBitmap_Destroy(bitmap);
            pdfium.FPDF_ClosePage(page);
            pdfium.FPDF_CloseDocument(doc);
            pdfium.pdfium.wasmExports.free(filePtr);
          }
          NODE

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for PDFium"
          git push
