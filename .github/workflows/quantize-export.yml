name: Quantize PDF export PNGs

on:
  push:
    branches: [feat/indexed-png-export]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Add PNG quantizer and update export
        shell: bash
        run: |
          npm install @upng/upng-js@2.2.2 --save-exact --no-audit --no-fund

          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text()

          import_old = "import { PDFDocument } from 'pdf-lib';"
          import_new = "import { PDFDocument } from 'pdf-lib';\nimport UPNG from '@upng/upng-js';"
          if text.count(import_old) != 1:
              raise SystemExit('Expected pdf-lib import not found exactly once')
          text = text.replace(import_old, import_new, 1)

          old_fn = '''function canvasToPng(canvas: HTMLCanvasElement): Promise<Blob> {\n  return new Promise((resolve, reject) => {\n    canvas.toBlob((blob) => {\n      if (blob) resolve(blob);\n      else reject(new Error('Could not encode a PDF page.'));\n    }, 'image/png');\n  });\n}\n\n'''
          if text.count(old_fn) != 1:
              raise SystemExit('Expected canvasToPng helper not found exactly once')
          text = text.replace(old_fn, '', 1)

          old_export = '''      const source = context.getImageData(0, 0, renderCanvas.width, renderCanvas.height);\n      context.putImageData(recolorImageData(source, settings), 0, 0);\n\n      const pngBlob = await canvasToPng(renderCanvas);\n      const png = await output.embedPng(await pngBlob.arrayBuffer());'''
          new_export = '''      const source = context.getImageData(0, 0, renderCanvas.width, renderCanvas.height);\n      const recolored = recolorImageData(source, settings);\n      const rgba = recolored.data.slice();\n      const pngBytes = UPNG.encode(\n        [rgba.buffer],\n        renderCanvas.width,\n        renderCanvas.height,\n        16,\n      );\n      const png = await output.embedPng(pngBytes);'''
          if text.count(old_export) != 1:
              raise SystemExit('Expected export PNG block not found exactly once')
          text = text.replace(old_export, new_export, 1)
          main.write_text(text)

          Path('src/upng-js.d.ts').write_text('''declare module '@upng/upng-js' {\n  type BufferLike = ArrayBuffer | SharedArrayBuffer;\n\n  const UPNG: {\n    encode(\n      images: BufferLike[],\n      width: number,\n      height: number,\n      colorCount: number,\n      delays?: number[],\n    ): ArrayBuffer;\n  };\n\n  export default UPNG;\n}\n''')

          readme = Path('README.md')
          readme_text = readme.read_text()
          needle = '- Higher-quality export rendering up to 4× (~288 DPI), with a 24 MP per-page safety limit\n'
          replacement = needle + '- 16-color indexed PNG quantization for smaller high-resolution exports\n'
          if needle not in readme_text:
              raise SystemExit('Expected 4x export README line not found')
          readme.write_text(readme_text.replace(needle, replacement, 1))
          PY

      - name: Build
        run: npm run build

      - name: Commit experiment and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/quantize-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/main.ts src/upng-js.d.ts README.md .github/workflows/quantize-export.yml
          git commit -m "Use 16-color indexed PNGs for PDF export"
          git push origin HEAD:feat/indexed-png-export
